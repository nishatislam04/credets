projects:
  - name: My project
    environments:
      - name: Production
        services:
          - name: credets-backend
            type: web
            runtime: docker
            plan: free
            region: singapore
            repo: https://github.com/nishatislam04/credets
            branch: main
            autoDeployTrigger: commit
            dockerfilePath: apps/backend/Dockerfile
            dockerContext: .
            healthCheckPath: /healthz
            envVars:
              - key: POSTGRES_URL
                sync: false
              - key: DB_HOST
                value: ep-shiny-mode-aolabxv6-pooler.c-2.ap-southeast-1.aws.neon.tech
              - key: DB_PORT
                value: "5432"
              - key: DB_USER
                value: neondb_owner
              - key: DB_PASSWORD
                sync: false
              - key: DB_NAME
                value: neondb
              - key: DB_TLS
                value: "true"
              - key: ENC_KEY
                sync: false
              - key: CSRF_SECRET_KEY
                sync: false
              - key: FRONTEND_APP
                value: https://credets.onrender.com
              - key: PORT
                value: "8000"
              - key: NODE_ENV
                value: production
