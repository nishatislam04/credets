services:
    db:
        image: postgres:18.3
        container_name: "credets-db"
        restart: unless-stopped
        shm_size: 128mb
        ports:
            - 5432:5432
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        volumes:
            - pgdata:/var/lib/postgresql
            - ./apps/backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - credets-network

    minio:
        image: minio/minio:latest
        container_name: "credets-storage"
        restart: unless-stopped
        ports:
            - 9000:9000   # S3-compatible API
            - 9001:9001   # Web UI console
        environment:
            MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
            MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
        volumes:
            - minio-data:/data
        command: server /data --console-address ":9001"
        healthcheck:
            test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s
        networks:
            - credets-network

    createbuckets:
        image: minio/mc:latest
        container_name: "credets-create-buckets"
        restart: on-failure
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY_ID:-minioadmin} $${STORAGE_SECRET_ACCESS_KEY:-minioadmin} &&
            mc mb local/$${STORAGE_BUCKET:-credentials} --ignore-existing &&
            mc anonymous set public local/$${STORAGE_BUCKET:-credentials} &&
            echo 'Bucket created and set to public' &&
            exit 0
            "
        networks:
            - credets-network

volumes:
    pgdata:
    minio-data:

networks:
    credets-network:
        driver: bridge
