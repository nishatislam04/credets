
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credets</title>
    <script>
      (function() {
        var theme = localStorage.getItem("credets-theme");
        var resolved = "light";
        if (theme === "dark") {
          resolved = "dark";
        } else if (theme === "light") {
          resolved = "light";
        } else {
          resolved = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.classList.toggle("dark", resolved === "dark");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
